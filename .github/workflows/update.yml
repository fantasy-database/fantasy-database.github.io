name: Refresh ratings

on:
  schedule:
    # 06:00 UTC every Tuesday — after Monday night fixtures have settled
    - cron: "0 6 * * 2"
  workflow_dispatch:        # adds a "Run workflow" button so you can trigger it by hand

permissions:
  contents: write           # lets the job commit the new data.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data.json
        run: python update.py

      - name: Commit if anything changed
        run: |
          git config user.name "fpl-ticker bot"
          git config user.email "actions@github.com"
          if git diff --quiet data.json; then
            echo "No change this week."
          else
            git add data.json
            git commit -m "Weekly ratings refresh"
            git push
          fi
