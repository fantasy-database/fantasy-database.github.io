name: Refresh ratings

on:
  schedule:
    # Daily. Prices change overnight and injury news lands most days, so the
    # player data goes stale far faster than the fixture ratings do.
    - cron: "30 6 * * *"
    # Again on Friday afternoon, to pick up the press-conference team news
    # before the usual evening deadline.
    - cron: "0 16 * * 5"
    # And late on Friday, for the weeks whose deadline is Friday 18:30 UK time:
    # the last odds and team news before the cut-off. Actions often starts
    # 10-20 minutes late, which still lands before 18:30. Cron is UTC, so this
    # is 17:40 in winter and 18:40 in summer; the season's Friday deadlines
    # from late October on are all in winter time. About 16 odds credits a month.
    - cron: "40 17 * * 5"
  workflow_dispatch:        # adds a "Run workflow" button so you can trigger it by hand

permissions:
  contents: write           # lets the job commit the new data.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update.py

      - name: Commit if anything changed
        run: |
          git config user.name "fpl-ticker bot"
          git config user.email "actions@github.com"
          git add data.json
          [ -f players.json ] && git add players.json
          [ -f market.json ] && git add market.json
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
          else
            git commit -m "Weekly data refresh"
            git push
            echo "Pushed:"
            git show --stat --oneline HEAD | head -8
          fi
